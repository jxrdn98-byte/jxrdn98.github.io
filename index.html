<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find Your Website Style</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Fraunces:wght@600&family=Space+Grotesk:wght@600&family=Poppins:wght@600&family=Bebas+Neue&family=DM+Serif+Display&family=Syne:wght@700&family=Lora:wght@600&family=Inter:wght@400;500&family=DM+Sans:wght@400;500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--sf:#fff;--tx:#1d1b19;--mu:#6f6a63;--bd:#e4ded4;--pr:#c65d3b;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141311;--sf:#1e1c1a;--tx:#f3efe8;--mu:#a29b90;--bd:#35312c}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 18px 60px}
h1,h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;line-height:1.1;margin:0 0 12px}
h1{font-size:clamp(34px,7vw,56px)}h2{font-size:clamp(26px,5vw,36px)}
p.lead{color:var(--mu);font-size:18px;max-width:560px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:28px}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.btn{background:var(--pr);color:#fff;border:0;border-radius:999px;padding:13px 28px;font:500 16px Inter,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:20px 0 26px}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:16px;padding:18px 12px;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.card:hover{transform:translateY(-2px)}.card.on{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 25%,transparent)}
.card .e{font-size:34px;display:block;margin-bottom:6px}.card .f{font-size:30px;display:block;line-height:1.2}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{width:100%;max-width:360px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;margin:8px 0 22px}
.sw{display:flex;border-radius:14px;overflow:hidden;height:70px;margin:10px 0}.sw div{flex:1;display:flex;align-items:flex-end;padding:6px;font-size:11px}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px;margin:18px 0}
.tags span{display:inline-block;background:var(--bd);border-radius:999px;padding:4px 12px;margin:0 6px 6px 0;font-size:13px}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ed label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
.ed select,.ed input[type=range]{width:100%}.ed select{padding:8px;border-radius:10px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.pals{display:flex;gap:8px;flex-wrap:wrap}.pals button{width:58px;height:34px;border-radius:10px;border:2px solid var(--bd);cursor:pointer;padding:0;overflow:hidden;display:flex}.pals button.on{border-color:var(--tx)}.pals button i{flex:1}
.frame{border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-top:12px}
.lo{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
/* generated site */
.site{background:var(--bg);color:var(--tx);font-family:var(--bf);line-height:1.55}
.site h3,.site .h{font-family:var(--hf);line-height:1.1;margin:0 0 12px;font-weight:normal}
.site nav{display:flex;justify-content:space-between;align-items:center;padding:calc(18px*var(--sp)) calc(28px*var(--sp));border-bottom:1px solid color-mix(in srgb,var(--tx) 12%,transparent)}
.site nav b{font-family:var(--hf);font-size:20px}.site nav span{font-size:14px;opacity:.7;margin-left:18px}
.site .hero{padding:calc(56px*var(--sp)) calc(28px*var(--sp));display:grid;gap:28px;align-items:center}
.site .hero.split{grid-template-columns:1.2fr 1fr}.site .hero.center{text-align:center;justify-items:center}
.site .hero .h{font-size:clamp(32px,6vw,54px)}.site .hero p{max-width:480px;opacity:.8;font-size:17px}
.site .sb{display:inline-block;background:var(--p);color:var(--pon);padding:12px 26px;border-radius:var(--r);font-weight:500;margin:6px 8px 0 0;font-family:var(--bf)}
.site .sb.o{background:transparent;color:var(--tx);border:1.5px solid var(--tx)}
.site .art{aspect-ratio:1;border-radius:var(--r);background:linear-gradient(135deg,var(--p),var(--a));max-width:300px;width:100%;position:relative}
.site .art:after{content:"";position:absolute;inset:18%;border-radius:calc(var(--r)*.7);background:var(--bg);opacity:.85}
.site .feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:calc(28px*var(--sp))}
.site .fc{background:var(--sf2);padding:calc(22px*var(--sp));border-radius:var(--r);border:1px solid color-mix(in srgb,var(--tx) 10%,transparent)}
.site .fc i{display:block;width:38px;height:38px;border-radius:calc(var(--r)*.6);background:var(--a);margin-bottom:12px}
.site .fc h3{font-size:20px}.site .fc p{margin:0;opacity:.75;font-size:15px}
.site .band{background:var(--p);color:var(--pon);padding:calc(44px*var(--sp)) 28px;text-align:center}
.site .band .h{font-size:clamp(22px,4vw,32px);max-width:620px;margin:0 auto 8px}
.site footer{padding:22px 28px;font-size:13px;opacity:.6;display:flex;justify-content:space-between}
@media(max-width:600px){.site .hero.split{grid-template-columns:1fr}.site nav span{display:none}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const FONTS={"Playfair Display":{t:{elegant:2}},"Fraunces":{t:{warm:1,earthy:1,soft:1}},"Space Grotesk":{t:{tech:2,cool:1}},"Poppins":{t:{playful:2,soft:1}},"Bebas Neue":{t:{bold:2}},"DM Serif Display":{t:{elegant:1,warm:1}},"Syne":{t:{bold:1,tech:1,playful:1}},"Lora":{t:{soft:1,earthy:1}}};
const BODY=["Inter","DM Sans","Work Sans","Lora"];
const PAL=[
{n:"Terracotta",bg:"#FBF4EC",s:"#FFFFFF",tx:"#3A2A22",p:"#C65D3B",a:"#E9B872",t:{warm:2,earthy:2,soft:1}},
{n:"Ocean Calm",bg:"#F2F8FA",s:"#FFFFFF",tx:"#12303B",p:"#1F7A8C",a:"#F4A261",t:{cool:2,soft:2}},
{n:"Midnight Neon",bg:"#0E0F1A",s:"#181A2C",tx:"#EDEBFF",p:"#7C5CFF",a:"#00E5C3",d:1,t:{tech:3,bold:1,cool:1}},
{n:"Sage Studio",bg:"#F4F5EF",s:"#FFFFFF",tx:"#26302A",p:"#5B7B5F",a:"#C9A66B",t:{earthy:3,soft:1,elegant:1}},
{n:"Candy Pop",bg:"#FFF7FB",s:"#FFFFFF",tx:"#2B1B34",p:"#FF4F9A",a:"#FFC531",t:{playful:3,bold:1,warm:1}},
{n:"Noir & Gold",bg:"#111010",s:"#1D1B1A",tx:"#F5EFE6",p:"#D4AF6A",a:"#8C2F39",d:1,t:{elegant:3,bold:1}},
{n:"Ink & Paper",bg:"#FAFAF7",s:"#FFFFFF",tx:"#1A1A1A",p:"#1F2A44",a:"#B5483A",t:{elegant:2,cool:1,soft:1}},
{n:"Sunset Glow",bg:"#1D1226",s:"#2A1B36",tx:"#FFEFE3",p:"#FF7A59",a:"#FFC15E",d:1,t:{warm:2,bold:2,playful:1}}];
const Q=[
{q:"What’s your favorite food?",h:"No wrong answers. Taste says a lot about style.",o:[["🍝","Pasta night",{warm:2,soft:1}],["🍣","Sushi",{cool:2,elegant:1,tech:1}],["🌮","Tacos",{playful:2,bold:1}],["🔥","BBQ",{bold:2,earthy:1,warm:1}],["🥗","Fresh salad",{earthy:2,soft:1}],["🍰","Dessert",{playful:1,elegant:1,soft:1}]]},
{q:"Which fonts feel like you?",h:"Pick up to two. Your first pick becomes your headline font.",fonts:1},
{q:"Where would you rather spend a Saturday?",o:[["🏖️","Beach",{cool:1,soft:2}],["🌲","Forest cabin",{earthy:3}],["🌆","City rooftop",{elegant:1,tech:1,bold:1}],["☕","Cozy café",{warm:2,soft:1}],["🏔️","Mountain hike",{earthy:1,bold:1,cool:1}],["🕹️","Neon arcade",{tech:2,playful:2}]]},
{q:"Pick a corner style.",h:"This decides how rounded your buttons and cards are.",o:[["◼️","Sharp",{bold:1,elegant:1},{r:0}],["▢","Softly rounded",{soft:1,warm:1},{r:14}],["⬭","Pill-shaped",{playful:2},{r:30}],["◩","Subtle",{cool:1,elegant:1},{r:6}]]},
{q:"How should your brand sound?",o:[["😊","Friendly & warm",{warm:2,soft:1}],["💎","Luxurious",{elegant:3}],["⚡","Bold & loud",{bold:3}],["🧘","Calm & trusted",{soft:2,cool:1}],["🤖","Smart & techy",{tech:3}],["🎉","Fun & cheeky",{playful:3}]]},
{q:"Which color mood grabs you?",o:[["🟧","Burnt orange",{warm:2,earthy:1}],["🟦","Deep teal",{cool:2,soft:1}],["🟪","Electric violet",{tech:2,bold:1}],["🟩","Moss green",{earthy:2,soft:1}],["🟥","Hot pink",{playful:2,bold:1}],["⬛","Black & gold",{elegant:2,bold:1}]]},
{q:"How much breathing room do you like?",h:"Controls layout and spacing.",o:[["🪟","Airy & minimal",{soft:1,elegant:1},{sp:1.25,lay:"center"}],["📰","Balanced & split",{cool:1},{sp:1,lay:"split"}],["🧱","Packed & rich",{bold:1,playful:1},{sp:.8,lay:"split"}],["🎯","Centered & bold",{bold:1,tech:1},{sp:1,lay:"center"}]]},
{q:"What time of day is your vibe?",h:"Decides light or dark mode.",o:[["🌅","Sunrise",{soft:1,warm:1},{dk:0}],["☀️","High noon",{bold:1,playful:1},{dk:0}],["🌇","Sunset",{warm:2},{dk:1}],["🌙","Midnight",{tech:1,elegant:1},{dk:2}]]}];
const TR=["warm","cool","bold","soft","elegant","playful","tech","earthy"];
let step=0,ans=[],name="",S=null,loadouts=[];
const $=id=>document.getElementById(id),app=$("app");
const sw=p=>[p.bg,p.s,p.tx,p.p,p.a];
function intro(){app.innerHTML=`<div class="bar"><i style="width:0"></i></div><h1>Let’s find the style that’s actually you.</h1>
<p class="lead">You’ll answer 8 quick, fun questions: food, fonts, places, and vibes. There are no wrong answers. At the end you’ll get your colors, fonts, and styling, plus a live sample website built from your choices that you can tweak.</p>
<p class="lead" style="font-size:15px">Take your time and go with your gut. First instinct is usually right.</p>
<label>Your name or business name</label><br><input type="text" id="nm" placeholder="e.g. Luna Bakery" value="${name}">
<br><button class="btn" id="go">I’m ready →</button>`;
$("go").onclick=()=>{name=$("nm").value.trim()||"Your Brand";step=1;q()}}
function q(){const Z=Q[step-1],sel=ans[step-1]||[];
app.innerHTML=`<div class="bar"><i style="width:${(step-1)/8*100}%"></i></div><p style="color:var(--mu);margin:0">Question ${step} of 8</p><h2>${Z.q}</h2><p class="lead" style="margin-top:0">${Z.h||""}</p>
<div class="grid">${Z.fonts?Object.keys(FONTS).slice(0,6).map(f=>`<button class="card ${sel.includes(f)?"on":""}" data-v="${f}"><span class="f" style="font-family:'${f}'">${f.split(" ")[0]}</span><small style="color:var(--mu)">Make it memorable</small></button>`).join(""):Z.o.map((o,i)=>`<button class="card ${sel.includes(i)?"on":""}" data-v="${i}"><span class="e">${o[0]}</span>${o[1]}</button>`).join("")}</div>
<div class="row">${step>1?'<button class="btn ghost" id="bk">← Back</button>':""}<button class="btn" id="nx" ${sel.length?"":"disabled"}>${step==8?"Show my style ✨":"Next →"}</button></div>`;
app.querySelectorAll(".card").forEach(c=>c.onclick=()=>{let v=Z.fonts?c.dataset.v:+c.dataset.v,a=ans[step-1]||[];
if(Z.fonts){a=a.includes(v)?a.filter(x=>x!=v):[...a,v].slice(-2)}else a=[v];ans[step-1]=a;q()});
$("nx").onclick=()=>{step==8?build():(step++,q())};if($("bk"))$("bk").onclick=()=>{step--;q()}}
function build(){const sc={};TR.forEach(t=>sc[t]=0);let r=14,sp=1,lay="split",dk=0,hf=null;
Q.forEach((Z,i)=>{(ans[i]||[]).forEach((v,j)=>{if(Z.fonts){const t=FONTS[v].t;for(const k in t)sc[k]+=t[k]*1.5;if(j==0)hf=v}else{const o=Z.o[v];for(const k in o[2])sc[k]+=o[2][k];const x=o[3]||{};if(x.r!=null)r=x.r;if(x.sp)sp=x.sp;if(x.lay)lay=x.lay;if(x.dk!=null)dk=x.dk}})});
let best=0,bs=-1e9;PAL.forEach((p,i)=>{let s=0;for(const k in p.t)s+=p.t[k]*sc[k];s+=p.d?dk*4-1:(dk==0?3:-dk*3);if(s>bs){bs=s;best=i}});
const top=TR.slice().sort((a,b)=>sc[b]-sc[a]);
if(!hf){hf={elegant:"Playfair Display",warm:"Fraunces",tech:"Space Grotesk",playful:"Poppins",bold:"Bebas Neue",earthy:"Lora",soft:"Lora",cool:"DM Serif Display"}[top[0]]}
const bf=["tech","bold","cool"].includes(top[0])?"Inter":top[0]=="earthy"?"Work Sans":"DM Sans";
S={pal:best,p:PAL[best].p,a:PAL[best].a,hf,bf,r,sp,lay,top:top.slice(0,3)};result()}
function copyFor(){const m={bold:["Make it impossible to ignore.","Big ideas, delivered boldly."],warm:["Made with care, served with heart.","Come in. You belong here."],elegant:["Quietly exceptional.","Crafted with intention, down to the last detail."],playful:["Work that’s actually fun.","Serious results. Zero boring."],tech:["Built for what’s next.","Smart tools and sharp design, ready today."],earthy:["Grounded. Honest. Made to last.","Rooted in craft and real materials."],soft:["Calm, clear, and considered.","Everything you need, nothing you don’t."],cool:["Clean, clear, confident.","Thoughtful design that gets out of your way."]};return m[S.top[0]]}
function site(){const P=PAL[S.pal],c=copyFor(),on=h=>{const n=parseInt(h.slice(1),16),y=((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000;return y>150?"#161616":"#fff"};
return `<div class="site" style="--bg:${P.bg};--sf2:${P.s};--tx:${P.tx};--p:${S.p};--a:${S.a};--pon:${on(S.p)};--hf:'${S.hf}',serif;--bf:'${S.bf}',sans-serif;--r:${S.r}px;--sp:${S.sp}">
<nav><b>${esc(name)}</b><div><span>About</span><span>Services</span><span>Gallery</span><span>Contact</span></div></nav>
<div class="hero ${S.lay}"><div><div class="h">${c[0]}</div><p>${c[1]} Welcome to ${esc(name)}.</p><span class="sb">Get started</span><span class="sb o">Learn more</span></div><div class="art"></div></div>
<div class="feat">${["Made for you","Designed to last","Easy to love"].map((t,i)=>`<div class="fc"><i></i><h3>${t}</h3><p>${["Every detail shaped around what you need.","Quality you can feel from day one.","Simple, friendly, and effortless to use."][i]}</p></div>`).join("")}</div>
<div class="band"><div class="h">Ready when you are.</div><span class="sb" style="background:var(--bg);color:var(--tx);margin-top:10px">Contact ${esc(name)}</span></div>
<footer><span>© ${esc(name)}</span><span>Instagram · Facebook · Email</span></footer></div>`}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function result(){const P=PAL[S.pal];
app.innerHTML=`<div class="bar"><i style="width:100%"></i></div><h1>Your style, ${esc(name)}.</h1>
<p class="lead">Here’s what your answers say. Below is a live sample site built from them, so you can edit everything and save loadouts.</p>
<div class="panel"><b>Your vibe</b><div class="tags" style="margin-top:8px">${S.top.map(t=>`<span>${t}</span>`).join("")}</div>
<b>Palette · ${P.n}</b><div class="sw" id="sw"></div>
<b>Fonts</b><p style="margin:6px 0"><span id="fh" style="font-size:30px"></span><br><span id="fb" style="color:var(--mu)"></span></p>
<b>Styling</b><p style="margin:6px 0;color:var(--mu)" id="st"></p></div>
<h2>Edit your loadout</h2><div class="panel"><div class="ed">
<div style="grid-column:1/-1"><label>Palette</label><div class="pals" id="pl">${PAL.map((p,i)=>`<button data-i="${i}" title="${p.n}">${[p.bg,p.p,p.a].map(c=>`<i style="background:${c}"></i>`).join("")}</button>`).join("")}</div></div>
<div><label>Primary color</label><input type="color" id="cp"></div><div><label>Accent color</label><input type="color" id="ca"></div>
<div><label>Headline font</label><select id="sh">${Object.keys(FONTS).map(f=>`<option>${f}</option>`).join("")}</select></div>
<div><label>Body font</label><select id="sb">${BODY.map(f=>`<option>${f}</option>`).join("")}</select></div>
<div><label>Corner roundness</label><input type="range" id="rr" min="0" max="32"></div>
<div><label>Spacing</label><input type="range" id="ss" min="70" max="140"></div>
<div><label>Hero layout</label><select id="sl"><option value="split">Split</option><option value="center">Centered</option></select></div></div>
<div class="row" style="margin-top:16px"><button class="btn" id="sv">Save loadout</button><button class="btn ghost" id="rs">Retake quiz</button></div>
<div id="los" style="margin-top:12px"></div></div>
<div class="frame" id="fr"></div>`;
const sync=()=>{const P=PAL[S.pal];$("fr").innerHTML=site();$("sw").innerHTML=[[P.bg,"Background"],[P.s,"Surface"],[P.tx,"Text"],[S.p,"Primary"],[S.a,"Accent"]].map(([c,l])=>`<div style="background:${c};color:${parseInt(c.slice(1),16)>8e6?"#111":"#fff"}">${l}<br>${c}</div>`).join("");
$("fh").style.fontFamily=`'${S.hf}'`;$("fh").textContent=S.hf;$("fb").style.fontFamily=`'${S.bf}'`;$("fb").textContent=S.bf+" (body text)";
$("st").textContent=`${S.r==0?"Sharp":S.r>24?"Pill":"Rounded"} corners (${S.r}px) · ${S.sp<.9?"compact":S.sp>1.1?"airy":"balanced"} spacing · ${S.lay} hero · ${P.d?"dark":"light"} theme`;
$("cp").value=S.p;$("ca").value=S.a;$("sh").value=S.hf;$("sb").value=S.bf;$("rr").value=S.r;$("ss").value=S.sp*100;$("sl").value=S.lay;
document.querySelectorAll("#pl button").forEach(b=>b.classList.toggle("on",+b.dataset.i==S.pal));
$("los").innerHTML=loadouts.map((l,i)=>`<div class="lo"><span>${esc(l.label)}</span><span><button class="btn ghost" data-a="${i}">Apply</button> <button class="btn ghost" data-d="${i}">✕</button></span></div>`).join("");
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S={...loadouts[b.dataset.a].s};sync()});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{loadouts.splice(b.dataset.d,1);persist();sync()})};
const live=()=>{$("fr").innerHTML=site()};
document.querySelectorAll("#pl button").forEach(b=>b.onclick=()=>{S.pal=+b.dataset.i;S.p=PAL[S.pal].p;S.a=PAL[S.pal].a;sync()});
$("cp").oninput=e=>{S.p=e.target.value;live()};$("ca").oninput=e=>{S.a=e.target.value;live()};
$("sh").onchange=e=>{S.hf=e.target.value;sync()};$("sb").onchange=e=>{S.bf=e.target.value;sync()};
$("rr").oninput=e=>{S.r=+e.target.value;live()};$("ss").oninput=e=>{S.sp=e.target.value/100;live()};$("sl").onchange=e=>{S.lay=e.target.value;live()};
$("sv").onclick=()=>{loadouts.push({label:`Loadout ${loadouts.length+1} · ${PAL[S.pal].n} · ${S.hf}`,s:{...S}});persist();sync()};
$("rs").onclick=()=>{step=0;ans=[];intro()};sync()}
function persist(){try{localStorage.setItem("sf_lo",JSON.stringify(loadouts))}catch(e){}}
try{loadouts=JSON.parse(localStorage.getItem("sf_lo")||"[]")}catch(e){loadouts=[]}
intro();
</script></body></html>
